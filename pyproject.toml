[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixgen-tools"
version = "0.1.0"
description = "Venue spec tooling: validation, C++ code generation and LLM-assisted spec extraction from PDF"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4", "jinja2>=3"]

[project.optional-dependencies]
specgen = ["pypdf>=4"]
claude = ["anthropic>=2.14"]
test = ["pytest>=8"]

[project.scripts]
fixgen = "fixgen.cli:main"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
fixgen = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["tools"]
